name: Update feed

on:
  schedule:
    # Every 2 hours, at :25 past. Two deliberate choices:
    #
    # Frequency: relative timestamps in the UI are computed from the last fetch,
    # not live. On a once-daily schedule the newest story aged from "8m ago" to
    # "17h ago" before the next run, so the feed only ever looked fresh for a
    # few minutes each morning. Twelve refreshes a day keeps the top of the feed
    # inside minutes-to-2-hours. A run costs ~45s and public repos get unlimited
    # Actions minutes, so the real cost is one commit per run to data/.
    #
    # Offset: never on the hour. GitHub's scheduler is heavily congested at :00
    # and delays or drops those runs; scheduled workflows are best-effort in any
    # case, so treat "every 2 hours" as approximate.
    - cron: '25 */2 * * *'
  workflow_dispatch: # Lets you trigger a refresh by hand from the Actions tab.
  push:
    branches: [main]
    paths:
      # Anything that changes what the published page looks like or contains,
      # so an edit goes live immediately instead of waiting up to 24h for the
      # nightly run. This originally listed only scripts/**, which meant a CSS
      # fix sat undeployed with no indication anything was pending.
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'docs/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/update.yml'
      # data/** is deliberately absent: it is this workflow's own output. Pushes
      # made with GITHUB_TOKEN do not trigger workflows, so there is no loop
      # today, but listing it would make one the moment a PAT was used instead.

# Only one update may run at a time.
#
# This was `cancel-in-progress: false`, to stop two runs racing on the commit.
# That reasoning was wrong, and it deadlocked the schedule for five days:
# a run wedged in `pending` with no jobs assigned held the group, and because
# GitHub permits only one *pending* run per group, every new scheduled run
# cancelled the previous pending one instead of ever starting. Result between
# 2026-08-06 and 2026-08-11: 45 cancellations, 1 failure, zero successes, and a
# dashboard that quietly went 110 hours stale.
#
# `true` is the safer trade. A push race is cheap and already self-corrects —
# the commit step rebases and retries once — whereas a wedged group never
# recovers on its own. Now a new run displaces a stuck one and the schedule
# heals itself.
concurrency:
  group: update-feed
  cancel-in-progress: true

permissions:
  contents: write # Needed to commit the refreshed data/ files.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No `npm ci` — this project has zero dependencies by design, so there is
      # nothing to install and no lockfile to audit.

      - name: Run tests
        # Parser regression tests. Cheap (<1s) and worth gating on: a parser
        # bug would quietly publish an empty or malformed feed.
        run: npm test

      - name: Fetch sources
        env:
          # The built-in token needs no setup and raises the GitHub Search API
          # limit from 10 to 30 requests/minute. Runner IPs are shared, so the
          # unauthenticated quota is often already spent by someone else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run update:verbose

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name  'techpulse-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # --exit-code is inverted for diff: 0 means "no changes".
          if git diff --quiet -- data/; then
            echo 'No feed changes — nothing to commit.'
            exit 0
          fi

          git add data/
          git commit -m "chore(data): refresh feed $(date -u +'%Y-%m-%d %H:%M UTC')"

          # A concurrent push (e.g. a manual dispatch) can land first; rebase
          # and retry once rather than failing the nightly run.
          git push || {
            echo 'Push rejected — rebasing on origin/main and retrying.'
            git pull --rebase --autostash origin main
            git push
          }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    # Bounded so a stuck Pages deployment cannot hold the concurrency group
    # open indefinitely. The update job has had a timeout since the start; this
    # one did not, which left an unbounded way to wedge the schedule.
    timeout-minutes: 10
    # Deploy even when `update` reports failure: a partially-refreshed feed is
    # still worth publishing, and `update` only fails hard when the run is badly
    # degraded. Skip only if it was cancelled.
    if: ${{ always() && needs.update.result != 'cancelled' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The update job just pushed a commit; make sure we publish it rather
          # than the tree this workflow started from.
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.' # Static site — index.html, assets/, data/, docs/.

      - id: deployment
        uses: actions/deploy-pages@v4
